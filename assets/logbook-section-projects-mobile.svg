<title id="title">Проекты — идеи становятся осязаемыми. Moritz · Logbook.</title>
<desc id="description">Проекты — идеи становятся осязаемыми. Moritz · Logbook.</desc>
<style>
.enter { animation: enter .9s cubic-bezier(.2,.8,.2,1) both; }
.delay-1 { animation-delay: .14s; }
.delay-2 { animation-delay: .28s; }
.delay-3 { animation-delay: .42s; }
.art { transform-origin: 80% 55%; animation: settle 4.5s ease-out both; }
.cursor { animation: cursor 1.25s ease-in-out 3; }
.trace { transform-origin: left; animation: trace 2s cubic-bezier(.2,.8,.2,1) both; }
@keyframes enter { from { transform: translateY(12px); } to { transform: translateY(0); } }
@keyframes settle { from { opacity: .75; transform: scale(1.035); } to { opacity: 1; transform: scale(1); } }
@keyframes cursor { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
@keyframes trace { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { .enter, .art, .cursor, .trace { animation: none !important; transform: none !important; opacity: 1 !important; } }
</style>
